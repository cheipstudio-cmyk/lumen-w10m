name: Build Lumen (W10M)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Set version
        shell: pwsh
        run: |
          $v = "1.0.$env:GITHUB_RUN_NUMBER.0"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $clean = $env:GITHUB_REF_NAME.TrimStart('v') -replace '[^0-9.].*$',''
            $p = @($clean.Split('.') | Where-Object { $_ -ne '' } | Select-Object -First 3)
            while ($p.Count -lt 3) { $p += '0' }
            $v = "$($p[0]).$($p[1]).$($p[2]).0"
          }
          $m = 'Lumen/Package.appxmanifest'
          (Get-Content $m -Raw) -replace '(<Identity [^>]*Version=")[0-9.]+(")', "`${1}$v`${2}" | Set-Content $m -NoNewline
          "APP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Version $v"

      - name: Pick Windows SDK
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP"
          $have = Get-ChildItem $root -Directory | ForEach-Object { $_.Name }
          Write-Host "Installed UAP SDKs: $($have -join ', ')"
          $pick = @('10.0.19041.0','10.0.22621.0','10.0.22000.0','10.0.18362.0','10.0.17763.0') | Where-Object { $have -contains $_ } | Select-Object -First 1
          if (-not $pick) { throw "No suitable Windows SDK found" }
          "SDK_VERSION=$pick" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Using $pick"

      - name: Signing certificate
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if ($env:SIGNING_PFX) {
            Write-Host "Using certificate from repository secrets"
            [IO.File]::WriteAllBytes("$pwd\sign.pfx", [Convert]::FromBase64String($env:SIGNING_PFX))
            $pw = $env:SIGNING_PASSWORD
          } else {
            Write-Host "No SIGNING_PFX secret: generating a one-off self-signed certificate"
            $pw = [Guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Second Dream" -KeyUsage DigitalSignature `
              -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -FriendlyName "Lumen sideload" `
              -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10) `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $sec = ConvertTo-SecureString -String $pw -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password $sec | Out-Null
          }
          $c = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$pwd\sign.pfx", $pw)
          if ($c.Subject -ne 'CN=Second Dream') { throw "Certificate subject '$($c.Subject)' must be 'CN=Second Dream' (Publisher in Package.appxmanifest)" }
          [IO.File]::WriteAllBytes("$pwd\out\Lumen.cer", $c.Export('Cert'))
          "::add-mask::$pw"
          "PFX_PASSWORD=$pw" | Out-File $env:GITHUB_ENV -Append

      - name: Build appxbundle (ARM + x64, .NET Native)
        shell: pwsh
        run: |
          msbuild Lumen/Lumen.csproj /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=ARM `
            /p:TargetPlatformVersion=$env:SDK_VERSION `
            /p:AppxBundle=Always "/p:AppxBundlePlatforms=ARM|x64" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            "/p:AppxPackageDir=$pwd\AppPackages\\" `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$pwd\sign.pfx" `
            "/p:PackageCertificatePassword=$env:PFX_PASSWORD" `
            /p:PackageCertificateThumbprint=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect install files
        shell: pwsh
        run: |
          $bundle = Get-ChildItem AppPackages -Recurse -Filter *.appxbundle | Select-Object -First 1
          if (-not $bundle) { throw "appxbundle not found" }
          Copy-Item $bundle.FullName "out\Lumen_$($env:APP_VERSION).appxbundle"
          $deps = Join-Path $bundle.DirectoryName 'Dependencies'
          foreach ($arch in @('ARM','x64')) {
            $d = Join-Path $deps $arch
            if (Test-Path $d) {
              New-Item -ItemType Directory -Force "out\Dependencies\$arch" | Out-Null
              Copy-Item "$d\*.appx" "out\Dependencies\$arch\"
            }
          }
          Get-ChildItem out -Recurse | ForEach-Object { Write-Host $_.FullName }
          Compress-Archive -Path out\* -DestinationPath "Lumen_$($env:APP_VERSION)_W10M.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen_${{ env.APP_VERSION }}
          path: out/

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Lumen_${{ env.APP_VERSION }}_W10M.zip
            out/Lumen_${{ env.APP_VERSION }}.appxbundle
            out/Lumen.cer

      - name: Clean up key material
        if: always()
        shell: pwsh
        run: Remove-Item sign.pfx -ErrorAction SilentlyContinue
